<body>

  <!-- Startbild: nur der Schriftzug auf Schwarz, bis die Welt darunter steht
       (startbild.js, startbild.css). Die Umrisse stammen aus dem Originallogo
       (LOGO/LOGO_1st_Ai.png, dieselben Konturen wie tools/make-ileen-logo.py):
       Strichstärke 18, Versalhöhe 144; Cyan sind der i-Punkt und die
       Mittelstriche der beiden E. Der Aufbau (Buchstabe für Buchstabe, ~3 s)
       ist so lang, dass das Überblenden in die Welt unmittelbar nach dem
       letzten Buchstaben einsetzt — Zeiten in startbild.css und minMs in
       startbild.js gehören zusammen. Steht VOR allem anderen im Body, damit
       es im ersten gezeichneten Bild da ist. -->
  <div id="ileenStart" role="img" aria-label="iLEEN">
    <!-- Jeder Buchstabe ein eigenes <svg> im HTML-Fluss, nicht eine Gruppe in EINEM svg:
         CSS-Animationen auf Elementen INNERHALB eines svg laufen im Hauptthread und
         ruckeln, solange dort die Skripte laden; auf dem svg-Element selbst läuft sie
         auf dem Compositor. Lage und Breite je Buchstabe (%) und viewBox leiten sich aus
         den Konturen ab (Gesamtraum x 160…1105, y 8…166). -->
    <div class="sb-block">
    <div class="sb-wort">
      <svg class="sb-b" style="--i:0; left:0.3175%; width:2.751%" viewBox="163 8 26 158" aria-hidden="true">
        <rect class="sb-c" x="167" y="15" width="18" height="28"/>
        <rect x="167" y="55" width="18" height="104"/>
      </svg>
      <svg class="sb-b" style="--i:1; left:11.429%; width:14.815%" viewBox="268 8 140 158" aria-hidden="true">
        <path d="M272 15h18v126h114v18H272z"/>
      </svg>
      <svg class="sb-b" style="--i:2; left:34.603%; width:15.026%" viewBox="487 8 142 158" aria-hidden="true">
        <rect x="491" y="15" width="134" height="18"/>
        <rect class="sb-c" x="491" y="78" width="134" height="18"/>
        <rect x="491" y="141" width="134" height="18"/>
      </svg>
      <svg class="sb-b" style="--i:3; left:57.884%; width:15.026%" viewBox="707 8 142 158" aria-hidden="true">
        <rect x="711" y="15" width="134" height="18"/>
        <rect class="sb-c" x="711" y="78" width="134" height="18"/>
        <rect x="711" y="141" width="134" height="18"/>
      </svg>
      <svg class="sb-b" style="--i:4; left:81.164%; width:18.519%" viewBox="927 8 175 158" aria-hidden="true">
        <path d="M931 15h18l131 118V15h18v144h-18L949 41v118h-18z"/>
      </svg>
    </div>
    <!-- Untertitel wie im Originallogo: Großbuchstaben, weit gesperrt, die Anfangsbuchstaben
         I · L · E in Cyan. textLength spannt ihn exakt von der Kante des i bis zur Kante des N. -->
    <svg class="sb-sub" viewBox="160 0 945 40" aria-hidden="true">
      <text x="167" y="30" textLength="931" lengthAdjust="spacing" font-size="31"><tspan class="sb-c2">I</tspan>MMERSIVE <tspan class="sb-c2">L</tspan>EARNING <tspan class="sb-c2">E</tspan>NVIRONMENT</text>
    </svg>
    </div>
  </div>
  <script>
    // Aus bei Automatisierung (die Prüfsteine klicken und messen sofort), mit
    // ?startbild=aus und mit localStorage.ileen_startbild = 'aus'.
    // ?startbild=an erzwingt es auch dort. Der Notausgang gibt die Szene nach
    // 15 s in jedem Fall frei — fehlt startbild.js oder bricht ein Modul vorher
    // ab, bliebe das Logo sonst für immer stehen.
    (function () {
      var el = document.getElementById('ileenStart');
      var aus = false;
      try {
        var p = new URLSearchParams(location.search).get('startbild');
        aus = p === 'aus' || (p !== 'an' && (navigator.webdriver || localStorage.getItem('ileen_startbild') === 'aus'));
      } catch (e) { /* privates Fenster: dann mit Startbild */ }
      if (aus) { el.remove(); return; }
      setTimeout(function () {
        if (!el.parentNode) return;
        el.className += ' geht';
        setTimeout(function () { if (el.parentNode) el.remove(); }, 2300);
      }, 15000);
    })();
  </script>

       START
       ============================================ -->
  <script>
    window.addEventListener('load', async function () {
      if (typeof BimViewer === 'undefined') {
        console.error('core.js nicht geladen');
        return;
      }

      try {
        await BimViewer.init();
      } catch (fehler) {
        console.error('BimViewer.init() fehlgeschlagen:', fehler);
        BimViewer.updateStatus('Viewer konnte nicht starten — siehe Konsole', 'error');
        return;
      }

      // Startvoreinstellung: BALANCED statt PERFORMANCE. PERFORMANCE schaltet
      // Schatten und HDR ab — ohne Schatten wirkt jedes Gebäude flach, und ohne
      // HDR bleiben die PBR-Texturen aus dem Backend weit unter dem, was sie
      // hergeben. Wer eine schwache GPU hat, wählt dort PERFORMANCE — die
      // Auswahl bleibt erhalten.
      let stufe = 'BALANCED';
      try { stufe = localStorage.getItem('ileen_performance_preset') || 'BALANCED'; } catch (e) { /* privat */ }
      const preset = CONFIG.performance.presets[stufe] || CONFIG.performance.presets.BALANCED;
      BimViewer.applyPerformanceSettings(preset);
      const auswahl = document.getElementById('performancePreset');
      if (auswahl) auswahl.value = CONFIG.performance.presets[stufe] ? stufe : 'BALANCED';

      // EGM96-Gitter für Höhen über dem Meer (Kompass-HUD, Flugverkehr)
      if (window.ILEEN_GEOID) ILEEN_GEOID.load();

      BimViewer.initFeatures();
      if (typeof BimViewer.initPointCloudSettings === 'function') BimViewer.initPointCloudSettings();

      // Notizen aus IndexedDB/localStorage
      if (typeof Tags !== 'undefined' && typeof Tags.init === 'function') {
        Tags.init().then(() => {
          if (window.BimViewerUI && BimViewerUI.tagsRefresh) BimViewerUI.tagsRefresh();
        }).catch(e => console.warn('Tags init failed:', e));
      }
    });
  </script>
